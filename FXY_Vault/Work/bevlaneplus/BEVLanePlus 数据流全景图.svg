<rect x="330" y="420" width="290" height="26" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="1"/>
<text x="475" y="434" font-size="12" font-weight="600" fill="#26215C" text-anchor="middle" dominant-baseline="central">InstanceBank features / anchors</text>
</g>

<g>
<rect x="40" y="472" width="600" height="90" rx="16" fill="#FBEAF0" stroke="#993556" stroke-width="1"/>
<text x="56" y="494" font-size="13" font-weight="600" fill="#72243E">④ 稀疏解码输出</text>

<rect x="60" y="506" width="270" height="40" rx="8" fill="#FFFFFF" stroke="#D4537E" stroke-width="1"/>
<text x="195" y="527" font-size="13" font-weight="600" fill="#72243E" text-anchor="middle" dominant-baseline="central">241 分类别 sparse anchors</text>

<rect x="350" y="506" width="270" height="40" rx="8" fill="#FFFFFF" stroke="#D4537E" stroke-width="1"/>
<text x="485" y="527" font-size="13" font-weight="600" fill="#72243E" text-anchor="middle" dominant-baseline="central">3-layer sparse temporal decoder</text>
</g>

<rect x="200" y="578" width="280" height="40" rx="8" fill="#F4C0D1" stroke="#993556" stroke-width="1"/>
<text x="340" y="599" font-size="13" font-weight="600" fill="#4B1528" text-anchor="middle" dominant-baseline="central">geometry + subtype + topology + ID</text>

