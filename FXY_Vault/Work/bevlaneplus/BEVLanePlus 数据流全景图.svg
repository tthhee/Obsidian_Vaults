<svg viewBox="0 0 680 620" width="100%" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
<title>BEVLanePlus 数据流全景图</title>
<desc>四阶段数据流：传感器感知、地图先验、时序记忆、稀疏解码输出</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="28" font-size="15" font-weight="600" fill="#26215C">BEVLanePlus 数据流全景</text>

<g>
<rect x="40" y="40" width="600" height="128" rx="16" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="56" y="62" font-size="13" font-weight="600" fill="#0C447C">① 传感器感知 · 多模态 BEV</text>

<rect x="60" y="78" width="160" height="52" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="1"/>
