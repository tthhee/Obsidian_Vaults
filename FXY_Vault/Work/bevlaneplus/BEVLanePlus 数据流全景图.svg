<path d="M355 446 L355 504" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M330 527 L262 527" fill="none" stroke="#D4537E" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 546 L340 576" fill="none" stroke="#993556" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M430 546 L430 598 L410 598" fill="none" stroke="#993556" stroke-width="1.5" marker-end="url(#arrow)"/>
