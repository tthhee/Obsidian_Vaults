<text x="140" y="116" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">双分支 LSS</text>

<rect x="260" y="78" width="130" height="52" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="1"/>
<text x="325" y="97" font-size="13" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">LiDAR 点云</text>
<text x="325" y="116" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">PFN + DenseResNet</text>

<rect x="430" y="78" width="110" height="52" rx="8" fill="#FFFFFF" stroke="#378ADD" stroke-width="1"/>
<text x="485" y="97" font-size="13" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">camera BEV</text>
<text x="485" y="116" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">+ LiDAR BEV</text>

<rect x="555" y="78" width="70" height="52" rx="8" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<text x="590" y="104" font-size="13" font-weight="600" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Fuser</text>
</g>

<path d="M220 104 L258 104" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M390 104 L428 104" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M540 104 L553 104" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M625 104 L625 172 L590 172 L590 188" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="40" y="192" width="600" height="116" rx="16" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="56" y="214" font-size="13" font-weight="600" fill="#27500A">② 地图先验 · 双路径</text>

<rect x="60" y="230" width="250" height="56" rx="8" fill="#FFFFFF" stroke="#639922" stroke-width="1"/>
<text x="185" y="250" font-size="13" font-weight="600" fill="#27500A" text-anchor="middle" dominant-baseline="central">LDLite 矢量地图 → LDLite BEV</text>
<text x="185" y="269" font-size="12" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">栅格先验 · LDLiteEncoder</text>

<rect x="330" y="230" width="290" height="56" rx="8" fill="#FFFFFF" stroke="#639922" stroke-width="1"/>
<text x="475" y="250" font-size="13" font-weight="600" fill="#27500A" text-anchor="middle" dominant-baseline="central">Nav/SD polyline → nav feature</text>
<text x="475" y="269" font-size="12" fill="#3B6D11" text-anchor="middle" dominant-baseline="central">矢量先验 · MapGraphTransformer</text>
</g>

<rect x="280" y="326" width="150" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="355" y="346" font-size="13" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">LDLite Fusion</text>

<path d="M185 286 L185 346 L280 346" fill="none" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M475 286 L475 346 L430 346" fill="none" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="40" y="384" width="600" height="72" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
